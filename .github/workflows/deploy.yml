name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compute manifest.json
        run: |
          node -e "
            const fs = require('fs');
            fs.writeFileSync('manifest.json', JSON.stringify({
              version: process.env.GITHUB_SHA,
              date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
            }));
          "

      # --- Unprefixed pass: produces content.zip, the OTA payload for the
      # GameRules iOS app. Must match scripts/export-ios.mjs's build exactly —
      # the app's WKURLSchemeHandler resolves absolute asset paths with no
      # prefix-stripping, so a content.zip built from the /game-rules/
      # -prefixed site 404s every asset and every in-page link once
      # downloaded (confirmed 2026-08-16: OTA swap produced an unstyled,
      # non-navigable home page).
      - name: Build unprefixed site (for content.zip)
        run: npm run build
        env:
          PATH_PREFIX: /

      - name: Check unprefixed build
        run: npm run check

      - name: Render PDFs (unprefixed)
        run: npm run pdfs
        env:
          PATH_PREFIX: /

      - name: Package content.zip
        run: |
          cp manifest.json _site/manifest.json
          cd _site && zip -r -X ../content.zip . && cd ..

      # --- Prefixed pass: the actual site GitHub Pages serves ---
      - name: Build site
        run: npm run build
        env:
          PATH_PREFIX: /game-rules/

      # Catches inline SVGs broken by Markdown's HTML-block rules, which the
      # build itself reports as a success.
      - name: Check built output
        run: npm run check

      # ubuntu-latest ships with Chrome preinstalled, so the PDFs are rendered
      # by the same engine (and the same print CSS) as a local build.
      - name: Render PDFs
        run: npm run pdfs
        env:
          PATH_PREFIX: /game-rules/

      # manifest.json + content.zip ship alongside the prefixed site so the
      # GameRules iOS app can fetch them at the site root.
      - name: Add manifest.json and content.zip to the site
        run: |
          cp manifest.json _site/manifest.json
          cp content.zip _site/content.zip

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
